# 本地开发用 PostgreSQL + pgvector + SeaweedFS
# 依 ADR-0031（平台自身存储）与 ADR-0034（生成物数据库）：PG 强制非可选
# SeaweedFS（ADR-0040②：对象存储首期必装，G-5 制品快照归档；NFR-9 例外登记在案）
#
# 端口用 55432 而非 5432，避免与 sksj 项目（5433/6380）等冲突。
# 隔离铁律（2026-10-04 用户）：不碰其他项目容器/端口/数据。
# 启动： docker compose up -d
services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: metastella-pg
    environment:
      POSTGRES_USER: metastella
      POSTGRES_PASSWORD: metastella_dev
      POSTGRES_DB: metastella
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metastella -d metastella"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - metastella-net
  seaweedfs:
    image: chrislusf/seaweedfs:3.67
    container_name: metastella-seaweedfs
    # 一体化 server：master+volume+filer+s3（S3 API=8333，G-5 快照归档面）
    command: "server -dir=/data -master.volumeSizeLimitMB=1024 -volume.port=8080 -s3 -s3.port=8333"
    ports:
      - "55833:9333"
      - "55880:8080"
      - "55844:8333"
    volumes:
      - seaweeddata:/data
    networks:
      - metastella-net

  # 平台 Redis（dev 口令非生产；缓存/会话/调度锁——P-10 裁定留用 Redis）
  redis:
    image: redis:7-alpine
    container_name: metastella-redis
    command: ["redis-server", "--requirepass", "metastella_dev"]
    restart: unless-stopped
    networks:
      - metastella-net

  # 平台后端（FastapiAdmin fork，DATABASE_TYPE=postgres——ADR-0031/0034 禁 MySQL）
  # 底座 docker/ compose 是 MySQL 路线，不复用；镜像用底座 Dockerfile 的 postgres 构建参数
  backend:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
      args:
        DB: postgres
    image: metastella-backend:dev
    container_name: metastella-backend
    # 底座镜像 CMD 写死 --env=prod（HTTPS 强跳+严格域白名单）；本机 dev 栈显式覆盖
    command: ["python", "main.py", "run", "--env=dev"]
    restart: unless-stopped
    environment:
      ENVIRONMENT: dev
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: "8001"
      DEBUG: "false"
      DATABASE_TYPE: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_USER: metastella
      DATABASE_PASSWORD: metastella_dev
      DATABASE_NAME: metastella
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: metastella_dev
      SECRET_KEY: metastella_dev_insecure_key_0123456789abcdef
      DEMO_ENABLE: "false"
      # 租户灰度门（11c）：claims/上下文已全链实证（超管 ENFORCE on 不误伤）；
      # 保持 false 直到 11d 给 User 挂 tenant_id 并回填——否则非超管全被 pending 锁。
      # TENANT_ENFORCE: "true"  # 11d 回填后翻此开关
      LOGGER_LEVEL: INFO
      # 注：曾试验 CAPTCHA_ENABLE=false——该版本前端 handleSubmit 硬依赖滑块 isPassing 位，
      # 关验证码反而无法登录（前后端开关不联动，登记 AUDIT 域前端缺陷）。保持默认 True。
      # O-9 首段基线后调参：单 worker 下 ddl×50 并发 p50 908ms→多 worker 复核（.scratch/o9-benchmark/）
      WORKERS: "2"
      # W2a：发布台账（F-3 跨重启判重）——表由 ensure_ledger 幂等建
      LEDGER_DSN: postgresql://metastella:metastella_dev@postgres:5432/metastella
    ports:
      - "127.0.0.1:58001:8001"
    volumes:
      - backend_upload:/home/static/upload
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - metastella-net

  # 平台前端（Vue3 dist 静态 + /api/v1 反代 backend；构建产物宿主机 dist 只读挂载）
  web:
    image: nginx:1.27-alpine
    container_name: metastella-web
    restart: unless-stopped
    volumes:
      - ../frontend/web/dist:/usr/share/nginx/html:ro
      - ./nginx-web.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:58080:80"
    depends_on:
      - backend
    networks:
      - metastella-net

  # 生成物冒烟应用（工单 07b：P-13 端到端"确定性生成→容器运行"首证）
  # 产物落 .scratch/tmp/library_smoke_app（生成器可复算；本服务只消费）
  library-smoke:
    build:
      context: ../../.scratch/tmp/library_smoke_app
    image: metastella-library-smoke:dev
    container_name: metastella-library-smoke
    restart: unless-stopped
    environment:
      DATABASE_URI: postgresql://metastella:metastella_dev@postgres:5432/metastella
    ports:
      - "127.0.0.1:58002:8001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - metastella-net
volumes:
  pgdata:
    # 收编旧壳仓时期卷（数据不迁移零风险；ADR-0037⑦钉版纪律的既有开发数据）
    external: true
    name: metastella-platform_pgdata
  seaweeddata:
  backend_upload:
networks:
  metastella-net:
    driver: bridge

# MU UI 模型 · 图书管理冒烟考题
schema_version: "1.0.0"
model_type: UI

screens:
  - id: SCREEN-LIBRARY-HOME
    name: 图书馆工作台
    screenType: WORKBENCH
    menus:
      - menuId: MENU-BOOK-MGMT
        name: 图书管理
        subMenus:
          - subMenuId: SUBMENU-BOOK-LIST
            name: 图书列表
            screenRef: SCREEN-BOOK-LIST
          - subMenuId: SUBMENU-BORROW-MGMT
            name: 借阅管理
            screenRef: SCREEN-BORROW-LIST
    layout: |
      +--------------------------------------+
      | 图书馆工作台          [注册]           |
      +--------------------------------------+
    actionPoints:
      - id: AP-READER-REGISTER
        name: 注册读者
        behaviorRef: Reader_register
        elementId: 注册
    elements:
      - id: 注册
        type: BUTTON
        label: 注册读者
  - id: SCREEN-BOOK-LIST
    name: 图书列表
    screenType: LIST
    layout: |
      +--------------------------------------+
      | 图书管理 > 图书列表                    |
      +--------------------------------------+
      | [bookNo____] [title____] [搜索] [新增] |
      | [借出] [归还]                          |
      +--------------------------------------+
      | 编号   | 书名     | 分类   | 状态     |
      | B001   | 三体     | 科技   | 在架     |
      | B002   | 红楼梦   | 文学   | 借出     |
      +--------------------------------------+
      |                              [1] [2] >|
      +--------------------------------------+
    actionPoints:
      - id: AP-BOOK-SEARCH
        name: 搜索图书
        behaviorRef: Book_query
        elementId: 搜索
      - id: AP-BOOK-BORROW
        name: 借出图书
        behaviorRef: Book_borrowOut
        elementId: 借出
      - id: AP-BOOK-RETURN
        name: 归还图书
        behaviorRef: Book_returnBack
        elementId: 归还
    elements:
      - id: bookNo
        type: TEXTBOX
        label: 图书编号
        io: I
        required: true
        dataBinding: Book.bookNo
      - id: title
        type: TEXTBOX
        label: 书名
        io: I
        required: true
        dataBinding: Book.title
      - id: listedAt
        type: DATEPICKER
        label: 入藏时间
        io: I
        dataBinding: Book.listedAt
      - id: 搜索
        type: BUTTON
        label: 搜索
      - id: 新增
        type: BUTTON
        label: 新增
      - id: 借出
        type: BUTTON
        label: 借出
      - id: 归还
        type: BUTTON
        label: 归还
      - id: grid
        type: GRID
        label: 图书列表
        io: O
  - id: SCREEN-BORROW-LIST
    name: 借阅管理
    screenType: LIST
    layout: |
      +--------------------------------------+
      | 图书管理 > 借阅管理                    |
      +--------------------------------------+
      | [borrowNo___] [borrowStatus_] [查询]  |
      +--------------------------------------+
      | 单号    | 图书   | 读者  | 状态      |
      | JY001   | 三体   | 张三  | 借出中    |
      | JY002   | 红楼梦 | 李四  | 已归还    |
      +--------------------------------------+
    actionPoints:
      - id: AP-BORROW-QUERY
        name: 查询借阅
        behaviorRef: BorrowRecord_queryHistory
        elementId: 查询
    elements:
      - id: borrowNo
        type: TEXTBOX
        label: 借阅单号
        io: I
        required: true
        dataBinding: BorrowRecord.borrowNo
      - id: borrowStatus
        type: COMBO
        label: 借阅状态
        io: I
        required: true
        dataBinding: BorrowRecord.borrowStatus
      - id: 查询
        type: BUTTON
        label: 查询
      - id: grid
        type: GRID
        label: 借阅列表
        io: O
